<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Husky Habitats</title></head>

<div id="app"></div>
<style>
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f7fb;color:#33404d}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d7e2ea;border-radius:24px;padding:22px;box-shadow:0 10px 28px #49677d14}.setup-card{background:linear-gradient(180deg,#fff,#fbfdff)}.title{text-align:center;font-size:2rem;margin:.2rem}.sub{text-align:center;color:#73808c}.row{display:flex;gap:12px;flex-wrap:wrap}.field{flex:1;min-width:180px}.field label{display:block;font-weight:800;margin:8px 0}.field input{width:100%;padding:12px;border:2px solid #cbd8e2;border-radius:14px;background:#fbfdff}.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:14px 0}.shop-item{border:2px solid #dce6ed;background:#fff;border-radius:18px;padding:12px;text-align:center;transition:.15s transform,.15s border-color}.shop-item:hover{transform:translateY(-2px)}.primary{background:#4c86a5;color:white;border:0;border-radius:14px;padding:12px 18px;font-weight:900;box-shadow:0 4px 0 #346783}.secondary{background:#fff;border:2px solid #b9c9d4;border-radius:14px;padding:10px 14px;font-weight:750}.secondary:disabled{opacity:.45;cursor:default}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#fff;border:1px solid #d3dfe7;border-radius:999px;padding:8px 12px;font-weight:800}.room{height:500px;position:relative;overflow:hidden;outline:none;border-radius:22px;border:6px solid #fff;box-shadow:0 12px 30px #38506622;background:#f7f1e7}.room.brick{
background:
linear-gradient(#0000 31px,#bb7d67 32px 34px,#0000 35px),
linear-gradient(90deg,#0000 62px,#bb7d67 63px 66px,#0000 67px),
linear-gradient(90deg,#0000 30px,#bb7d67 31px 34px,#0000 35px),
linear-gradient(#d89b82 0 68%,#d7bea0 68%);
background-size:100% 68px,126px 68px,126px 68px,auto;
background-position:0 0,0 0,63px 34px,0 0;
}.room.stars{
background:
radial-gradient(circle at 10% 14%,#fff7bf 0 3px,#0000 4px),
radial-gradient(circle at 30% 22%,#fff7bf 0 2px,#0000 3px),
radial-gradient(circle at 52% 10%,#fff7bf 0 3px,#0000 4px),
radial-gradient(circle at 76% 25%,#fff7bf 0 2px,#0000 3px),
radial-gradient(circle at 90% 12%,#fff7bf 0 3px,#0000 4px),
radial-gradient(circle at 18% 42%,#fff7bf 0 2px,#0000 3px),
radial-gradient(circle at 44% 36%,#fff7bf 0 3px,#0000 4px),
radial-gradient(circle at 68% 48%,#fff7bf 0 2px,#0000 3px),
radial-gradient(circle at 86% 39%,#fff7bf 0 3px,#0000 4px),
linear-gradient(#58678e 0 68%,#d7bea0 68%);
}.room.darkfloor{
background:
repeating-linear-gradient(90deg,#0000 0 78px,#3f2e24 79px 82px) bottom/100% 32% no-repeat,
linear-gradient(#f7f1e7 0 68%,#654a39 68%);
}.room.checker{
background:
conic-gradient(from 90deg,#e9ecef 25%,#9da6ad 0 50%,#e9ecef 0 75%,#9da6ad 0) 0 100%/54px 54px no-repeat,
linear-gradient(#f7f1e7 0 68%,#9da6ad 68%);
background-size:100% 100%,auto;
}.placed{position:absolute;transform:translate(-50%,-50%);line-height:1;background:transparent;border:0;padding:4px;z-index:6;touch-action:none;filter:drop-shadow(0 5px 2px #0002);cursor:grab}.placed span{display:block}.room-item-image{display:block;width:auto;height:auto;max-width:none;max-height:none;pointer-events:none;transform:scale(2);transform-origin:center center}.item-image{display:block;width:auto;height:auto;max-width:100%;max-height:82px;object-fit:contain;margin:auto}.fallback-icon{font-size:46px}.placed.dragging{cursor:grabbing;transform:translate(-50%,-50%) scale(1.08);z-index:20}.move-hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#ffffffd9;border:1px solid #d8e1e8;border-radius:999px;padding:5px 11px;font-size:.78rem;color:#6e7a83;z-index:10;pointer-events:none}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.panel{margin-top:12px}.answers{display:grid;gap:10px;margin-top:16px}.answer{padding:13px;border:2px solid #c3d0d9;background:#fff;border-radius:14px;text-align:left;font-weight:700}.answer:hover{background:#f0f8fb}.feedback{font-weight:900;min-height:28px;margin-top:10px}.price{font-weight:900}.rare{color:#7950a8}.loot{padding:15px;background:#fff7d6;border:1px solid #e2c45d;border-radius:14px;margin-top:12px;display:flex;align-items:center;gap:10px}.loot .item-image{width:54px;height:54px;margin:0}.tiny{font-size:.85rem;color:#6d7780}.item-art{min-height:88px;display:grid;place-items:center;padding:4px}.hidden{display:none}@media(max-width:600px){.room{height:390px}.placed{font-size:54px}.move-hint{font-size:.68rem;white-space:nowrap}}
.pet-animated{transform-origin:center bottom;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.pet-bob{animation-name:pet-bob}
.pet-squish{animation-name:pet-squish}
.pet-hop{animation-name:pet-hop}
.pet-wiggle{animation-name:pet-wiggle}
@keyframes pet-bob{
  0%,72%,100%{transform:scale(2) translateY(0)}
  84%{transform:scale(2) translateY(-3px)}
  92%{transform:scale(2) translateY(0)}
}
@keyframes pet-squish{
  0%,76%,100%{transform:scale(2)}
  86%{transform:scale(2.1,1.9)}
  93%{transform:scale(1.96,2.04)}
}
@keyframes pet-hop{
  0%,70%,100%{transform:scale(2) translateY(0)}
  82%{transform:scale(2) translateY(-6px)}
  90%{transform:scale(2.05,1.95) translateY(0)}
}
@keyframes pet-wiggle{
  0%,74%,100%{transform:scale(2) rotate(0deg)}
  82%{transform:scale(2) rotate(-3deg)}
  90%{transform:scale(2) rotate(3deg)}
  96%{transform:scale(2) rotate(0deg)}
}
@media (prefers-reduced-motion: reduce){
  .pet-animated{animation:none}
}
.shop-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.shop-tab{border:2px solid #c9d6df;background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;color:#56636d}
.shop-tab:hover{background:#f1f7fa}
.shop-tab.active{background:#4c86a5;border-color:#4c86a5;color:#fff}

.inventory-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}

.room-item-image.flipped{transform:scale(-2,2)}
.pet-animated.flipped{animation-name:pet-idle-flipped}
@keyframes pet-idle-flipped{
  0%,72%,100%{transform:scale(-2,2) translateY(0)}
  80%{transform:scale(-2,2.06) translateY(-3px)}
  88%{transform:scale(-2.12,1.88) translateY(0)}
  94%{transform:scale(-1.96,2.04) translateY(-1px)}
}

.collections-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:14px}
.collection-card{border:2px solid #dce6ed;border-radius:20px;background:#fbfdff;padding:14px}
.collection-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.collection-head>div{display:flex;align-items:center;gap:8px}
.collection-emoji{font-size:1.4rem}
.collection-progress{font-size:.82rem;font-weight:800;color:#6a7780;background:#eef3f6;border-radius:999px;padding:5px 9px;white-space:nowrap}
.collection-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.collection-item{position:relative;border:1px solid #d9e2e8;border-radius:14px;padding:8px;background:#fff;opacity:.52;text-align:center}
.collection-item.owned{opacity:1;border-color:#86b79d;background:#f4fbf7}
.collection-check{position:absolute;right:6px;top:5px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#edf1f4;color:#7a8790;font-weight:900}
.collection-item.owned .collection-check{background:#dff2e6;color:#2d7650}
.collection-thumb{height:62px;display:grid;place-items:center;margin-bottom:4px}
.collection-thumb .item-image{max-height:58px}
.collection-name{font-size:.78rem;font-weight:800;line-height:1.15}
@media(max-width:520px){.collections-grid{grid-template-columns:1fr}.collection-items{grid-template-columns:1fr 1fr}}



.baseboard{
 position:absolute;
 left:0;right:0;top:67.2%;
 height:8px;
 background:#b79d80;
 z-index:2;
 pointer-events:none;
}
.placed{z-index:6}
.placed.turnable{cursor:grab}

.wall-surface,.floor-surface{position:absolute;left:0;right:0;z-index:1;pointer-events:none;background-repeat:repeat;background-position:left top;image-rendering:pixelated}
.wall-surface{top:0;height:68%;background-color:#f7f1e7}
.floor-surface{top:68%;bottom:0;background-color:#d7bea0}
.baseboard{z-index:2}
.placed{z-index:6}

.save-btn{background:#fff;border:1px solid #cfd9e2;border-radius:999px;padding:8px 12px;font-weight:800;color:#33404d}
.save-btn:hover{background:#f4f8fb}
.save-status{align-self:center;font-size:.8rem;color:#65727b;min-width:0}
.setup-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.wall-surface,.floor-surface{
 background-size:auto;
}

.floor-surface{
  background-size:64px 64px;
}

.pet-animated.flipped.pet-bob{animation-name:pet-bob-flipped}
.pet-animated.flipped.pet-squish{animation-name:pet-squish-flipped}
.pet-animated.flipped.pet-hop{animation-name:pet-hop-flipped}
.pet-animated.flipped.pet-wiggle{animation-name:pet-wiggle-flipped}
@keyframes pet-bob-flipped{
  0%,72%,100%{transform:scale(-2,2) translateY(0)}
  84%{transform:scale(-2,2) translateY(-3px)}
  92%{transform:scale(-2,2) translateY(0)}
}
@keyframes pet-squish-flipped{
  0%,76%,100%{transform:scale(-2,2)}
  86%{transform:scale(-2.1,1.9)}
  93%{transform:scale(-1.96,2.04)}
}
@keyframes pet-hop-flipped{
  0%,70%,100%{transform:scale(-2,2) translateY(0)}
  82%{transform:scale(-2,2) translateY(-6px)}
  90%{transform:scale(-2.05,1.95) translateY(0)}
}
@keyframes pet-wiggle-flipped{
  0%,74%,100%{transform:scale(-2,2) rotate(0deg)}
  82%{transform:scale(-2,2) rotate(-3deg)}
  90%{transform:scale(-2,2) rotate(3deg)}
  96%{transform:scale(-2,2) rotate(0deg)}
}

let s={screen:"setup",first:"",initial:"",coins:100,xp:0,streak:0,inventory:[],placed:[],wall:"plain",floor:"plain",q:null,answered:0,loot:null};
const app=document.querySelector("#app");
const SAVE_KEY="huskyHabitatsSaveV1";
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(s));
    showSaveStatus("Saved! 💾");
  }catch(e){
    showSaveStatus("Could not save on this browser.");
  }
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const saved=JSON.parse(raw);
    s={...s,...saved,screen:"game"};
    render();
    showSaveStatus("Loaded saved habitat.");
    return true;
  }catch(e){return false}
}
function showSaveStatus(msg){
  let el=document.querySelector("#saveStatus");
  if(!el)return;
  el.textContent=msg;
  clearTimeout(showSaveStatus.t);
  showSaveStatus.t=setTimeout(()=>{if(el)el.textContent=""},1800);
}

function render(){
 if(s.screen==="setup")return setup();
 let wallItem=catalog.find(x=>x.id===s.wall),floorItem=catalog.find(x=>x.id===s.floor);
 app.innerHTML='<div class="shell"><div class="topbar"><div><b>🐾 Husky Habitats</b><div class="tiny">'+esc(s.first)+' '+esc(s.initial)+'.\'s Room</div></div><div class="stats"><span class="pill">🪙 '+s.coins+'</span><span class="pill">⭐ '+s.xp+' XP</span><span class="pill">🔥 '+s.streak+'</span><button id="saveBtn" class="save-btn">💾 Save</button><span id="saveStatus" class="save-status" aria-live="polite"></span></div></div><div id="room" class="room" aria-label="Your room"><div class="wall-surface"></div><div class="floor-surface"></div><div class="baseboard"></div>'+s.placed.map((p,i)=>{let x=catalog.find(a=>a.id===p.id);let flip=p.dir==="right"?" flipped":"";return '<button class="placed'+(x.turnable?' turnable':'')+'" data-place="'+i+'" style="left:'+p.x+'%;top:'+p.y+'%" aria-label="Move '+x.name+(x.turnable?'. Double-click to turn.':'')+'">'+itemVisual(x,"room",flip,x.cat==="Pets"?i:null)+'</button>'}).join("")+'<div class="move-hint">Drag your things anywhere in the room ✨</div></div><div class="nav"><button class="primary" data-view="questions">📚 Answer Questions</button><button class="secondary" data-view="shop">🛍️ Shop</button><button class="secondary" data-view="inventory">🎒 Inventory</button><button class="secondary" data-view="collections">📖 Collections</button></div><div id="panel" class="card panel"></div></div>';
 document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>panel(b.dataset.view));
 const saveBtn=document.querySelector("#saveBtn"); if(saveBtn)saveBtn.onclick=saveGame;
 const wallSurface=document.querySelector(".wall-surface");
 const floorSurface=document.querySelector(".floor-surface");
 if(wallSurface) wallSurface.style.backgroundImage=wallItem&&wallItem.img?'url("'+wallItem.img+'")':"none";
 if(floorSurface) floorSurface.style.backgroundImage=floorItem&&floorItem.img?'url("'+floorItem.img+'")':"none";
 enableDragging();
 document.querySelectorAll(".placed.turnable").forEach(b=>b.addEventListener("dblclick",e=>{e.preventDefault();e.stopPropagation();turnItem(+b.dataset.place)}));
 panel("questions");
}
function setup(){
 app.innerHTML='<div class="shell"><div class="card setup-card"><h1 class="title">🐾 Husky Habitats</h1><p class="sub">Build a room that is completely yours.</p><div class="row"><div class="field"><label>Your first name</label><input id="first" maxlength="18" placeholder="Your real first name"></div><div class="field"><label>Your last initial</label><input id="initial" maxlength="1" placeholder="R"></div></div><p class="tiny">Use your real first name and last initial so your teacher knows which habitat is yours.</p><div class="setup-actions"><button id="start" class="primary">Start My Habitat →</button><button id="continueSave" class="secondary" style="display:none">💾 Continue Saved Habitat</button></div><div id="setupmsg" class="feedback"></div></div></div>';
 const savedButton=document.querySelector("#continueSave");
 try{if(localStorage.getItem(SAVE_KEY))savedButton.style.display=""}catch(e){}
 savedButton.onclick=()=>loadGame();
 document.querySelector("#start").onclick=()=>{let f=document.querySelector("#first").value.trim(),i=document.querySelector("#initial").value.trim();if(!f||!/^[A-Za-z]$/.test(i)){document.querySelector("#setupmsg").textContent="Please enter your real first name and one last initial.";return}s.first=f[0].toUpperCase()+f.slice(1).toLowerCase();s.initial=i.toUpperCase();s.screen="game";render()};
}
function ownedCount(id){return s.inventory.filter(x=>x===id).length}
function placedCount(id){return s.placed.filter(x=>x.id===id).length}
function panel(v){
 const p=document.querySelector("#panel");
 if(v==="questions"){if(!s.q)newQ();p.innerHTML='<h2>Earn Coins</h2><p>What does the Greek/Latin stem <b>'+s.q.stem+'</b> mean?</p><div class="answers">'+s.q.opts.map(o=>'<button class="answer" data-a="'+o+'">'+o+'</button>').join("")+'</div><div id="feedback" class="feedback"></div>'+ (s.loot?'<div class="loot">🎁 <b>Loot drop!</b> '+itemVisual(s.loot,"loot")+' <span>'+s.loot.name+' was added to your inventory!</span></div>':"");document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(b.dataset.a));}
 if(v==="shop"){shopPanel(p,"All");}
 if(v==="collections"){collectionsPanel(p);}
 if(v==="inventory"){let owned=catalog.filter(x=>ownedCount(x.id)>0);p.innerHTML='<h2>🎒 Inventory</h2><p class="tiny">Place as many copies as you own, then drag them where you want them.</p>'+(owned.length?'<div class="shop-grid">'+owned.map(x=>'<div class="shop-item"><div class="item-art">'+itemVisual(x,"shop")+'</div><b>'+x.name+'</b><div class="tiny">'+x.cat+' • Owned: '+ownedCount(x.id)+'</div><div class="inventory-actions"><button class="secondary" data-use="'+x.id+'" '+(((!["Walls","Floors"].includes(x.cat)&&placedCount(x.id)>=ownedCount(x.id))||(x.cat==="Walls"&&s.wall===x.id)||(x.cat==="Floors"&&s.floor===x.id))?"disabled":"")+'>'+useLabel(x)+'</button>'+((!["Walls","Floors"].includes(x.cat)&&placedCount(x.id)>0)?'<button class="secondary" data-remove="'+x.id+'">Remove One</button>':"")+'</div></div>').join("")+'</div>':'<p>Your inventory is empty. Answer questions and visit the shop!</p>');document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>useItem(b.dataset.use));document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeOne(b.dataset.remove));}
}
function collectionsPanel(p){
 p.innerHTML='<h2>📖 Collections</h2><p class="tiny">Own at least one item to check it off. Mix and match however you want in your room.</p><div class="collections-grid">'+collections.map(col=>{let found=col.items.filter(id=>ownedCount(id)>0).length;return '<section class="collection-card"><div class="collection-head"><div><span class="collection-emoji">'+col.emoji+'</span><b>'+col.name+'</b></div><span class="collection-progress">'+found+'/'+col.items.length+' owned</span></div><div class="collection-items">'+col.items.map(id=>{let x=catalog.find(a=>a.id===id);if(!x)return "";let owned=ownedCount(id)>0;return '<div class="collection-item '+(owned?'owned':'')+'"><div class="collection-check">'+(owned?'✓':'○')+'</div><div class="collection-thumb">'+itemVisual(x,"shop")+'</div><div class="collection-name">'+x.name+'</div></div>'}).join("")+'</div></section>'}).join("")+'</div>';
}
function shopPanel(p,active){
 const cats=["All","Furniture","Decor","Pets","Windows","Walls","Floors"];
 const items=active==="All"?catalog:catalog.filter(x=>x.cat===active);
 p.innerHTML='<h2>🛍️ Habitat Shop</h2><p class="tiny">Furniture, decor, pets, and windows can be bought more than once.</p><div class="shop-tabs">'+cats.map(c=>'<button class="shop-tab '+(c===active?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join("")+'</div><div class="shop-grid">'+items.map(x=>{let count=ownedCount(x.id),oneOnly=["Walls","Floors"].includes(x.cat);return '<div class="shop-item"><div class="item-art">'+itemVisual(x,"shop")+'</div><b>'+x.name+'</b><div class="tiny">'+x.cat+(count?' • Owned: '+count:'')+'</div><div class="price">🪙 '+x.price+'</div><button class="secondary" data-buy="'+x.id+'" '+(oneOnly&&count?"disabled":"")+'>'+(oneOnly&&count?"Owned":count?"Buy Another":"Buy")+'</button></div>'}).join("")+'</div>';
 p.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>shopPanel(p,b.dataset.cat));
 p.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
}
function enableDragging(){
 const room=document.querySelector("#room"); if(!room)return;
 room.querySelectorAll(".placed").forEach(el=>{
   el.addEventListener("pointerdown",e=>{
     e.preventDefault(); const idx=+el.dataset.place; el.setPointerCapture(e.pointerId); el.classList.add("dragging");
     const move=ev=>{const r=room.getBoundingClientRect();let x=((ev.clientX-r.left)/r.width)*100;let y=((ev.clientY-r.top)/r.height)*100;x=Math.max(3,Math.min(91,x));y=Math.max(4,Math.min(80,y));s.placed[idx].x=x;s.placed[idx].y=y;el.style.left=x+"%";el.style.top=y+"%";};
     const up=()=>{el.classList.remove("dragging");el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);};
     el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
   });
 });
}
function itemVisual(x,where,extra="",petIndex=null){
 if(x.img){
   const cls=where==="room"?"room-item-image":"item-image";
   let petClass="",petStyle="";
   if(where==="room"&&x.cat==="Pets"){
     const variants=["pet-bob","pet-squish","pet-hop","pet-wiggle"];
     const idx=petIndex==null?0:petIndex;
     petClass=" pet-animated "+variants[idx%variants.length];
     const delay=-((idx*0.47)%3.8);
     const duration=2.6+(idx%4)*0.35;
     petStyle=' style="animation-delay:'+delay+'s;animation-duration:'+duration+'s"';
   }
   return '<img class="'+cls+petClass+extra+'" src="'+x.img+'" alt=""'+petStyle+'>';
 }
 return '<span class="fallback-icon">'+(x.icon||"")+'</span>';
}
function newQ(){let keys=Object.keys(stems),stem=keys[Math.floor(Math.random()*keys.length)],correct=stems[stem],wrong=[...new Set(Object.values(stems).filter(x=>x!==correct))].sort(()=>Math.random()-.5).slice(0,3);s.q={stem,correct,opts:[correct,...wrong].sort(()=>Math.random()-.5)};s.loot=null}
function answer(a){let f=document.querySelector("#feedback");document.querySelectorAll("[data-a]").forEach(b=>b.disabled=true);if(a===s.q.correct){s.coins+=20;s.xp+=10;s.streak++;s.answered++;f.textContent="Correct! +20 coins 🪙";let rewardDelay=1100;if(s.streak>0&&s.streak%25===0){let pool=catalog.filter(x=>!s.inventory.includes(x.id)&&!["Walls","Floors"].includes(x.cat));if(pool.length){let item=pool[Math.floor(Math.random()*pool.length)];s.inventory.push(item.id);s.loot=item;f.textContent="🔥 "+s.streak+"-answer streak! You earned "+item.name+"!";rewardDelay=3200}}setTimeout(()=>{newQ();render()},rewardDelay)}else{s.streak=0;s.answered++;f.textContent="Not quite. "+s.q.stem+" means "+s.q.correct+".";document.querySelector(".pill:last-child").textContent="🔥 0";setTimeout(()=>{newQ();render()},1400)}}
function buy(id){let x=catalog.find(a=>a.id===id);if(s.coins<x.price){alert("You need "+(x.price-s.coins)+" more coins.");return}s.coins-=x.price;s.inventory.push(id);render();panel("shop")}
function useLabel(x){if(x.cat==="Walls")return s.wall===x.id?"In Use":"Use Wallpaper";if(x.cat==="Floors")return s.floor===x.id?"In Use":"Use Flooring";let available=ownedCount(x.id)-placedCount(x.id);return available>0?(placedCount(x.id)>0?"Place Another":"Place in Room"):"All Placed"}
function useItem(id){let x=catalog.find(a=>a.id===id);if(x.cat==="Walls"){s.wall=id}else if(x.cat==="Floors"){s.floor=id}else if(placedCount(id)<ownedCount(id)){s.placed.push({id,x:42+(s.placed.length*8)%35,y:58-(s.placed.length%3)*10,dir:"left"})}render();panel("inventory")}
function removeOne(id){let found=s.placed.map(p=>p.id).lastIndexOf(id);if(found>=0)s.placed.splice(found,1);render();panel("inventory")}
function turnItem(index){if(!s.placed[index])return;s.placed[index].dir=s.placed[index].dir==="right"?"left":"right";render();}
function esc(x){return x.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
render();
</script>
</body>
</html>
