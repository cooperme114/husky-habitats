name: Export Google Sites Embed
on:
  push:
    paths:
      - "google-sites/embed-code.txt"
      - ".github/workflows/export-embed.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: husky-habitats-google-sites
          path: google-sites/embed-code.txt
